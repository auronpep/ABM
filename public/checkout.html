  <link rel="stylesheet" href="styles.css">

  <style>
    body { background: var(--bg); }
    .co-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .co-nav {
      border-bottom: 1px solid var(--rule);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }
    .co-nav .brand {
      font-family: var(--serif);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.01em;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .co-nav .brand .mark {
      width: 26px;
      height: 26px;
      background: var(--ink);
      color: var(--bg);
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-weight: 900;
      font-size: 16px;
      transform: translateY(3px);
    }
    .co-nav .brand .dot { width: 5px; height: 5px; background: var(--red); display: inline-block; margin-left: 2px; transform: translateY(-2px); }
    .co-nav .secure {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .co-nav .secure .lock {
      width: 16px; height: 16px; border: 1.5px solid var(--muted); border-radius: 2px;
      position: relative;
    }
    .co-nav .secure .lock::before {
      content: ""; position: absolute; top: -5px; left: 3px; width: 8px; height: 6px;
      border: 1.5px solid var(--muted); border-bottom: none; border-radius: 4px 4px 0 0;
    }

    .co-body {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      gap: 0;
    }
    .co-left {
      padding: 56px 56px 56px 32px;
      border-right: 1px solid var(--rule);
      background: var(--bg);
      min-height: calc(100vh - 65px);
    }
    .co-right {
      padding: 56px 32px 56px 56px;
      background: var(--paper);
      min-height: calc(100vh - 65px);
    }

    /* Left column: order summary */
    .order-summary { max-width: 480px; }
    .eyebrow-co {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--red);
      font-weight: 600;
      margin-bottom: 24px;
    }
    .order-title {
      font-family: var(--serif);
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0 0 16px;
    }
    .order-sub {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 36px;
      max-width: 50ch;
    }

    .product-card {
      border: 1px solid var(--ink);
      padding: 22px 24px;
      background: var(--paper);
      margin-bottom: 24px;
    }
    .product-card .row1 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
      gap: 16px;
    }
    .product-card .name {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.01em;
      line-height: 1.1;
      white-space: nowrap;
    }
    .product-card .meta {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .product-card .desc {
      font-size: 14px;
      color: var(--ink-soft);
      line-height: 1.5;
      margin: 0;
    }

    /* Plan toggle */
    .plan-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--ink);
      margin-bottom: 24px;
    }
    .plan-opt {
      padding: 16px 18px;
      cursor: pointer;
      border-right: 1px solid var(--ink);
      background: var(--paper);
      transition: background 120ms;
      position: relative;
    }
    .plan-opt:last-child { border-right: none; }
    .plan-opt.active {
      background: var(--ink);
      color: var(--bg);
    }
    .plan-opt .lbl {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .plan-opt.active .lbl { color: var(--red); }
    .plan-opt .price {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.015em;
      line-height: 1;
      margin-bottom: 4px;
    }
    .plan-opt .sub {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .plan-opt.active .sub { color: var(--muted-light); }

    /* Capacity row */
    .capacity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border: 1px solid var(--red);
      background: rgba(200, 16, 46, 0.04);
      margin-bottom: 16px;
      gap: 12px;
    }
    .capacity-row .lbl {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--red);
      font-weight: 600;
      text-transform: uppercase;
    }
    .capacity-row .desc {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 4px;
    }
    .capacity-row .amount {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 22px;
      color: var(--red);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    /* Totals */
    .totals {
      border-top: 1px solid var(--rule);
      padding-top: 20px;
      margin-bottom: 28px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      font-size: 14px;
    }
    .total-row .k { color: var(--muted); }
    .total-row .v {
      font-family: var(--mono);
      color: var(--ink);
      font-weight: 500;
    }
    .total-row.grand {
      border-top: 2px solid var(--ink);
      margin-top: 12px;
      padding-top: 16px;
      align-items: baseline;
    }
    .total-row.grand .k {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .total-row.grand .v {
      font-family: var(--serif);
      font-size: 40px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .what-included {
      border-top: 1px solid var(--rule-soft);
      padding-top: 24px;
    }
    .what-included .label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .what-included ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .what-included li {
      padding: 8px 0;
      font-size: 13px;
      color: var(--ink-soft);
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 10px;
      align-items: baseline;
    }
    .what-included li::before {
      content: "→";
      font-family: var(--mono);
      color: var(--red);
      font-weight: 600;
    }

    /* Right column: form */
    .co-form { max-width: 520px; }
    .form-section {
      margin-bottom: 32px;
    }
    .form-section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .form-section-header .num {
      width: 24px; height: 24px;
      background: var(--ink);
      color: var(--bg);
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
    }
    .form-section-header h3 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.01em;
      margin: 0;
      line-height: 1.1;
      white-space: nowrap;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 10px;
    }
    .form-row.split {
      grid-template-columns: 2fr 1fr;
    }
    .form-row.split-3 {
      grid-template-columns: 2fr 1fr 1fr;
    }
    .form-field { position: relative; }
    .form-field label {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-field input,
    .form-field select {
      width: 100%;
      padding: 14px 16px;
      font-family: var(--sans);
      font-size: 15px;
      border: 1px solid var(--rule);
      background: var(--bg);
      color: var(--ink);
      outline: none;
      transition: border-color 120ms;
      box-sizing: border-box;
    }
    .form-field input:focus,
    .form-field select:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 1px var(--ink);
    }
    .form-field input::placeholder { color: var(--muted-light); }
    .form-field .card-icon {
      position: absolute;
      right: 14px;
      top: 38px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 600;
    }
    .terms-row {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 12px;
      margin-bottom: 20px;
      align-items: start;
      padding: 14px;
      border: 1px solid var(--rule);
      background: var(--bg);
    }
    .terms-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--red);
      cursor: pointer;
    }
    .terms-row .text {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.45;
    }
    .terms-row .text a { text-decoration: underline; color: var(--ink); }
    .pay-btn {
      width: 100%;
      padding: 20px;
      background: var(--ink);
      color: white;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid var(--ink);
      cursor: pointer;
      transition: background 140ms;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .pay-btn:hover:not(:disabled) {
      background: var(--red);
      border-color: var(--red);
    }
    .pay-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .pay-btn .lock-icon {
      width: 14px; height: 14px; border: 1.5px solid currentColor; border-radius: 1px;
      position: relative;
    }
    .pay-btn .lock-icon::before {
      content: ""; position: absolute; top: -4px; left: 2.5px; width: 7px; height: 5px;
      border: 1.5px solid currentColor; border-bottom: none; border-radius: 3px 3px 0 0;
    }
    .pay-meta {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-align: center;
      margin-top: 14px;
      line-height: 1.6;
    }

    /* Success screen */
    .success-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      padding: 64px 24px;
    }
    .success-card {
      max-width: 720px;
      width: 100%;
      border: 1px solid var(--ink);
      background: var(--paper);
      box-shadow: 12px 12px 0 var(--red);
      padding: 0;
    }
    .success-head {
      background: var(--ink);
      color: var(--bg);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .success-head .verdict {
      background: var(--correct);
      color: white;
      padding: 4px 10px;
      letter-spacing: 0.15em;
      font-weight: 600;
    }
    .success-body { padding: 48px 48px 40px; }
    .success-body .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--red);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .success-body h1 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 56px;
      letter-spacing: -0.025em;
      line-height: 1.02;
      margin: 0 0 20px;
    }
    .success-body h1 em {
      color: var(--red);
      font-style: italic;
      font-weight: 700;
    }
    .success-body .lede {
      font-family: var(--serif);
      font-size: 19px;
      color: var(--ink-soft);
      line-height: 1.5;
      margin: 0 0 36px;
      max-width: 56ch;
    }
    .receipt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--rule);
      margin-bottom: 32px;
    }
    .receipt-grid > div {
      padding: 16px 18px;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .receipt-grid > div:nth-child(2n) { border-right: none; }
    .receipt-grid > div:nth-last-child(-n+2) { border-bottom: none; }
    .receipt-grid .k {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .receipt-grid .v {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.005em;
    }
    .receipt-grid .v.mono { font-family: var(--mono); font-size: 14px; }

    .next-steps {
      border-top: 2px solid var(--ink);
      padding-top: 24px;
    }
    .next-steps .label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .next-step {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--rule-soft);
      align-items: center;
      cursor: pointer;
      transition: padding 100ms;
    }
    .next-step:last-child { border-bottom: none; }
    .next-step:hover { padding-left: 8px; }
    .next-step .num {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 28px;
      color: var(--red);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .next-step .name {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.005em;
    }
    .next-step .sub {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-top: 4px;
    }
    .next-step .arrow {
      font-family: var(--mono);
      font-size: 18px;
    }

    /* Loading state */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.92);
      display: grid;
      place-items: center;
      z-index: 200;
      color: white;
      font-family: var(--mono);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .loading-overlay .spinner {
      width: 80px; height: 80px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay .label {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: white;
      text-align: center;
    }
    .loading-overlay .sub {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      margin-top: 8px;
      text-align: center;
      letter-spacing: 0.1em;
    }

    @media (max-width: 900px) {
      .co-body { grid-template-columns: 1fr; }
      .co-left, .co-right { padding: 32px 24px; }
      .co-left { border-right: none; border-bottom: 1px solid var(--rule); }
    }
  </style>
</head>
<body data-screen-label="Checkout">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const PRICING = {
      flagshipPrice: 999,
      planStandard: { d1: 500, d2: 499 },
    };

    const Checkout = () => {
      const initialPlan = new URLSearchParams(window.location.search).get("plan") === "split" ? "plan" : "payInFull";
      const [plan, setPlan] = React.useState(initialPlan); // payInFull | plan
      const [email, setEmail] = React.useState("");
      const [name, setName] = React.useState("");
      const [card, setCard] = React.useState("");
      const [exp, setExp] = React.useState("");
      const [cvc, setCvc] = React.useState("");
      const [zip, setZip] = React.useState("");
      const [country, setCountry] = React.useState("US");
      const [terms, setTerms] = React.useState(false);
      const [marketing, setMarketing] = React.useState(true);
      const [state, setState] = React.useState("form"); // form | loading | success

      const due = plan === "payInFull" ? PRICING.flagshipPrice : PRICING.planStandard.d1;

      const total = PRICING.flagshipPrice;
      const base = PRICING.flagshipPrice;

      const canSubmit = email && name && card.length >= 14 && exp && cvc && terms;

      const submit = (e) => {
        e?.preventDefault?.();
        if (!canSubmit) return;
        setState("loading");
        setTimeout(() => setState("success"), 2200);
      };

      // ── Card formatting helpers ──
      const fmtCard = (v) => v.replace(/\D/g, "").slice(0, 16).replace(/(\d{4})(?=\d)/g, "$1 ");
      const fmtExp = (v) => {
        const d = v.replace(/\D/g, "").slice(0, 4);
        return d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d;
      };

      if (state === "success") return <SuccessScreen email={email} name={name} due={due} total={total} plan={plan} />;

      return (
        <React.Fragment>
          <div className="co-shell">
            {/* Nav */}
            <nav className="co-nav">
              <a href="index.html" style={{ textDecoration: "none", color: "inherit" }}>
                <div className="brand">
                  <span className="mark">B</span>
                  <span>BarMatrix<span className="dot"></span></span>
                </div>
              </a>
              <div className="secure">
                <div className="lock"></div>
                <span>SECURE CHECKOUT · STRIPE</span>
              </div>
            </nav>

                    <div className="form-row">
                      <div className="form-field">

                          placeholder="you@email.com"
                          value={email}
                          onChange={(e) => setEmail(e.target.value)}

                        />
                      </div>
                    </div>
                    <div className="form-row">
                      <div className="form-field">
                        <label>FULL NAME · ON CARD</label>
                        <input
                          type="text"
                          placeholder="Jordan Reyes"
                          value={name}
                          onChange={(e) => setName(e.target.value)}
                          autoComplete="cc-name"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Section 2: payment */}
                  <div className="form-section">
                    <div className="form-section-header">
                      <span className="num">2</span>
                      <h3>Payment</h3>
                    </div>
                    <div className="form-row">
                      <div className="form-field">
                        <label>CARD NUMBER</label>
                        <input
                          type="text"
                          placeholder="1234 1234 1234 1234"
                          value={card}
                          onChange={(e) => setCard(fmtCard(e.target.value))}

                    <div className="form-row split">
                      <div className="form-field">
                        <label>EXPIRATION (MM/YY)</label>

                          type="text"
                          placeholder="MM / YY"
                          value={exp}
                          onChange={(e) => setExp(fmtExp(e.target.value))}
                          inputMode="numeric"
                          autoComplete="cc-exp"
                        />
                      </div>
                      <div className="form-field">
                        <label>CVC</label>
                        <input
                          type="text"
                          placeholder="123"
                          maxLength="4"
                          value={cvc}
                          onChange={(e) => setCvc(e.target.value.replace(/\D/g, ""))}

                          autoComplete="cc-csc"
                        />
                      </div>
                    </div>
                    <div className="form-row split">
                      <div className="form-field">
                        <label>ZIP / POSTAL CODE</label>

                          type="text"
                          placeholder="94110"

                      <div className="form-field">
                        <label>COUNTRY</label>
                        <select value={country} onChange={(e) => setCountry(e.target.value)}>

                          <option value="GB">United Kingdom</option>
                          <option value="AU">Australia</option>
                          <option value="OTHER">Other</option>

                    </div>
                  </div>

                      <span className="num">3</span>

                    </div>
                    <div className="terms-row">
                      <input type="checkbox" id="terms" checked={terms} onChange={(e) => setTerms(e.target.checked)} />

                    <div className="terms-row">

                    <button type="submit" className="pay-btn" disabled={!canSubmit}>

                    <div className="pay-meta">
                      <div>SECURED BY STRIPE · 256-BIT TLS</div>
                      <div>7-DAY MONEY-BACK GUARANTEE · CANCEL ANY TIME IN ACCOUNT</div>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>

          {state === "loading" && (
            <div className="loading-overlay">
              <div>
                <div className="spinner"></div>

            <div className="success-head">

              <div className="receipt-grid">

                <div>
                  <div className="k">Product</div>

                  <div className="v">${total}.00</div>

                <div>
                  <div className="k">Charged today</div>
                  <div className="v">${due}.00</div>

              </div>

              <div className="next-steps">
                <div className="label">▌ YOUR NEXT 3 STEPS</div>
                <a href="index.html#diagnostic" className="next-step" style={{ textDecoration: "none", color: "inherit" }} onClick={(e) => { e.preventDefault(); window.location.href = "index.html"; }}>
                  <span className="num">01</span>
